<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>IGN Pulse</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #000000);
      --text: var(--tg-theme-text-color, #f5f5f5);
      --muted: var(--tg-theme-hint-color, #a8a8a8);
      --border: rgba(255, 255, 255, 0.12);
      --accent: var(--tg-theme-button-color, #e63946);
      --accent-text: var(--tg-theme-button-text-color, #fff);
      --bar: rgba(0, 0, 0, 0.92);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --header-h: 52px;
      --gap: 2px;
    }

    body.light-theme {
      --bg: var(--tg-theme-bg-color, #fafafa);
      --text: var(--tg-theme-text-color, #111);
      --muted: var(--tg-theme-hint-color, #737373);
      --border: rgba(0, 0, 0, 0.1);
      --bar: rgba(255, 255, 255, 0.96);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      padding-top: calc(var(--header-h) + var(--safe-top));
      padding-bottom: var(--safe-bottom);
    }

    /* ---- Top bar ---- */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 40;
      height: calc(var(--header-h) + var(--safe-top));
      padding: var(--safe-top) 12px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bar);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .brand span.mark {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #e63946, #ff6b35);
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    .top-actions { display: flex; gap: 6px; }

    .icon-btn {
      width: 36px; height: 36px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .icon-btn:active { opacity: 0.6; }

    /* ---- Instagram-style 3-column grid ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--gap);
      width: 100%;
      max-width: 935px; /* IG desktop content width */
      margin: 0 auto;
    }

    .grid-item {
      position: relative;
      aspect-ratio: 1 / 1;
      background: #1a1a1a;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    body.light-theme .grid-item { background: #efefef; }

    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transition: transform 0.25s ease;
    }

    .grid-item:hover img { transform: scale(1.03); }

    .grid-item .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      opacity: 0;
      transition: opacity 0.2s;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      pointer-events: none;
    }
    .grid-item:hover .overlay { opacity: 1; }

    .grid-item .ph {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 28px;
      opacity: 0.3;
    }

    /* ---- Empty / loading ---- */
    .state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 64px 20px;
      color: var(--muted);
    }
    .state h3 { color: var(--text); margin: 8px 0 4px; font-size: 16px; }

    .skeleton-item {
      aspect-ratio: 1 / 1;
      background: linear-gradient(90deg, #1a1a1a, #2a2a2a, #1a1a1a);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }
    body.light-theme .skeleton-item {
      background: linear-gradient(90deg, #eee, #f5f5f5, #eee);
      background-size: 200% 100%;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ---- Detail view (1 post, full screen, scrollable) ---- */
    .detail {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      visibility: hidden;
    }

    .detail.open {
      transform: translateX(0);
      visibility: visible;
    }

    .detail-header {
      flex-shrink: 0;
      height: calc(var(--header-h) + var(--safe-top));
      padding: var(--safe-top) 8px 0;
      display: flex;
      align-items: center;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      background: var(--bar);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .detail-header .back {
      width: 40px; height: 40px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
      display: grid;
      place-items: center;
      border-radius: 10px;
    }

    .detail-header .title {
      font-weight: 700;
      font-size: 15px;
      flex: 1;
    }

    .detail-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .detail-media {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: #0d0d0d;
      position: relative;
    }

    body.light-theme .detail-media { background: #f0f0f0; }

    /* Show full image without aggressive crop */
    .detail-media img {
      width: 100%;
      height: auto;
      max-height: min(75vh, 800px);
      object-fit: contain;
      object-position: center;
      display: block;
      margin: 0 auto;
      background: #000;
    }

    body.light-theme .detail-media img { background: #f0f0f0; }

    .detail-media .ph {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      font-size: 48px;
      opacity: 0.3;
    }

    .detail-body {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px 16px calc(24px + var(--safe-bottom));
      width: 100%;
    }

    .detail-meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 500;
    }

    .detail-caption {
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .detail-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 42px;
      padding: 0 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
      flex: 1;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* Desktop: slightly larger gap, centered grid */
    @media (min-width: 736px) {
      :root { --gap: 4px; }
      .grid { margin-top: 8px; margin-bottom: 24px; border-radius: 4px; overflow: hidden; }
    }

    @media (min-width: 1024px) {
      .detail-media img { max-height: 80vh; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark">🎮</span>
      IGN Pulse
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-theme" type="button" aria-label="Theme">🌓</button>
      <button class="icon-btn" id="btn-refresh" type="button" aria-label="Refresh">↻</button>
    </div>
  </header>

  <main id="grid" class="grid" aria-label="Post grid"></main>

  <!-- Single-post detail (1 grid / full post) -->
  <div class="detail" id="detail" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="detail-header">
      <button class="back" id="detail-back" type="button" aria-label="Back">←</button>
      <div class="title">Post</div>
    </div>
    <div class="detail-scroll" id="detail-scroll">
      <div class="detail-media" id="detail-media"></div>
      <div class="detail-body">
        <div class="detail-meta" id="detail-meta"></div>
        <p class="detail-caption" id="detail-caption"></p>
        <div class="detail-actions">
          <a class="btn btn-primary" id="detail-open" href="#" target="_blank" rel="noopener">Open on Instagram</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor("bg_color"); } catch (_) {}
      try { tg.setBackgroundColor("bg_color"); } catch (_) {}
    }

    const API_URL = "/api/posts";
    let posts = [];

    function applyTheme(force) {
      const scheme = force || (tg?.colorScheme || "dark");
      document.body.classList.toggle("light-theme", scheme === "light");
    }
    applyTheme();
    if (tg) tg.onEvent("themeChanged", () => applyTheme());

    document.getElementById("btn-theme").addEventListener("click", () => {
      document.body.classList.toggle("light-theme");
    });

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Client-side safety net for any leftover CTAs
    function cleanCaption(text) {
      if (!text) return "";
      let t = String(text);
      const patterns = [
        /\s*link\s+in\s+(?:the\s+)?(?:bio|comments?)\b[^.!\n]*[.!]?/gi,
        /\s*read\s+more\s+in\s+(?:bio|comments?)\b[^.!\n]*[.!]?/gi,
        /\s*full\s+(?:review|article|story)\s+in\s+(?:bio|comments?)\b[^.!\n]*[.!]?/gi,
        /\s*more\s+(?:info|details?|here)\s+in\s+(?:bio|comments?)\b[^.!\n]*[.!]?/gi,
        /\s*(?:check|see|click)(?:\s+out)?\s+(?:the\s+)?link\s+in\s+bio\b[^.!\n]*[.!]?/gi,
        /\s*link\s+in\s+bio\b[.!]?/gi,
        /\s*(?:check|see|click)(?:\s+out)?\s+the\s*$/gi,
        /\s*view\s+all\s+\d+\s+comments\b[.!]?/gi,
        /\s*\.{2,}\s*$/g,
      ];
      for (const p of patterns) t = t.replace(p, "");
      return t.replace(/[ \t]+/g, " ").trim().replace(/^[.\-–—|\s]+|[.\-–—|\s]+$/g, "");
    }

    function imageSrc(url) {
      if (!url) return "";
      return "/api/image?url=" + encodeURIComponent(url);
    }

    function formatDate(iso) {
      if (!iso) return "";
      try {
        const d = new Date(iso);
        const diff = (Date.now() - d) / 1000;
        if (diff < 60) return "Just now";
        if (diff < 3600) return Math.floor(diff / 60) + "m ago";
        if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
        if (diff < 604800) return Math.floor(diff / 86400) + "d ago";
        return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      } catch { return ""; }
    }

    function showSkeletons() {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      for (let i = 0; i < 12; i++) {
        const el = document.createElement("div");
        el.className = "skeleton-item";
        grid.appendChild(el);
      }
    }

    function renderGrid() {
      const grid = document.getElementById("grid");
      if (!posts.length) {
        grid.innerHTML = `
          <div class="state">
            <div style="font-size:36px">📭</div>
            <h3>No posts yet</h3>
            <p>New posts will show up here in a 3-column grid.</p>
          </div>`;
        return;
      }

      grid.innerHTML = "";
      posts.forEach((post, index) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "grid-item";
        item.setAttribute("aria-label", "Open post");
        const src = imageSrc(post.image_url);

        item.innerHTML = `
          <div class="ph">🎬</div>
          ${src ? `<img src="${escapeHtml(src)}" alt="" loading="lazy" decoding="async" />` : ""}
          <div class="overlay">View</div>
        `;

        const img = item.querySelector("img");
        if (img) {
          img.addEventListener("load", () => {
            const ph = item.querySelector(".ph");
            if (ph) ph.style.display = "none";
          });
          img.addEventListener("error", () => { img.style.display = "none"; });
        }

        item.addEventListener("click", () => openDetail(index));
        grid.appendChild(item);
      });
    }

    function openDetail(index) {
      const post = posts[index];
      if (!post) return;

      const media = document.getElementById("detail-media");
      const caption = cleanCaption(post.caption) || "No caption.";
      const src = imageSrc(post.image_url);

      media.innerHTML = src
        ? `<img src="${escapeHtml(src)}" alt="" />`
        : `<div class="ph">🎬</div>`;

      const img = media.querySelector("img");
      if (img) {
        img.addEventListener("error", () => {
          media.innerHTML = `<div class="ph">🎬</div>`;
        });
      }

      document.getElementById("detail-meta").textContent = formatDate(post.created_at);
      document.getElementById("detail-caption").textContent = caption;

      const openBtn = document.getElementById("detail-open");
      openBtn.href = post.link || "#";

      const detail = document.getElementById("detail");
      detail.classList.add("open");
      detail.setAttribute("aria-hidden", "false");
      document.getElementById("detail-scroll").scrollTop = 0;

      // Telegram back button if available
      if (tg?.BackButton) {
        tg.BackButton.show();
        tg.BackButton.onClick(closeDetail);
      }
    }

    function closeDetail() {
      const detail = document.getElementById("detail");
      detail.classList.remove("open");
      detail.setAttribute("aria-hidden", "true");
      if (tg?.BackButton) {
        tg.BackButton.hide();
        try { tg.BackButton.offClick(closeDetail); } catch (_) {}
      }
    }

    document.getElementById("detail-back").addEventListener("click", closeDetail);

    // Swipe-from-left edge to close (mobile)
    let touchStartX = 0;
    document.getElementById("detail").addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });
    document.getElementById("detail").addEventListener("touchend", (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (touchStartX < 40 && dx > 80) closeDetail();
    }, { passive: true });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeDetail();
    });

    async function fetchPosts() {
      showSkeletons();
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "API error");
        posts = (data.posts || []).map((p) => ({
          ...p,
          caption: cleanCaption(p.caption),
        }));
        renderGrid();
      } catch (err) {
        console.error(err);
        document.getElementById("grid").innerHTML = `
          <div class="state">
            <div style="font-size:36px">⚠️</div>
            <h3>Couldn't load posts</h3>
            <p>Tap refresh and try again.</p>
          </div>`;
      }
    }

    document.getElementById("btn-refresh").addEventListener("click", fetchPosts);
    fetchPosts();
  </script>
</body>
</html>
