<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IGN 3D Feed Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #121212);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --card-bg: var(--tg-theme-secondary-bg-color, rgba(255, 255, 255, 0.08));
      --hint-color: var(--tg-theme-hint-color, #8e8e93);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --card-border: rgba(255, 255, 255, 0.12);
      --shadow-color: rgba(0, 0, 0, 0.3);
    }

    body.light-theme {
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-border: rgba(0, 0, 0, 0.08);
      --shadow-color: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      perspective: 1000px;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(0, 0, 0, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
    }

    .feed {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 500px;
      margin: 16px auto;
      padding: 0 16px 32px 16px;
    }

    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px var(--shadow-color);
      transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .post-image {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      transform: translateZ(12px);
      background: rgba(128, 128, 128, 0.15);
    }

    .post-content {
      padding: 16px;
      transform: translateZ(24px);
    }

    .post-caption {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--hint-color);
    }

    .btn-action {
      background: var(--button-color);
      color: var(--button-text);
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      font-size: 12px;
      transform: translateZ(16px);
      display: inline-block;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--hint-color);
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <header class="app-header">
    <h2>🎮 IGN Feed</h2>
    <span id="theme-indicator" style="font-size: 12px; color: var(--hint-color);">Theme: Auto</span>
  </header>

  <main id="feed" class="feed">
    <div class="loading">Loading 3D feed...</div>
  </main>

  <script>
    // --- TELEGRAM WEBAPP SDK ---
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function applyTheme() {
      if (tg.colorScheme === 'light') {
        document.body.classList.add('light-theme');
        document.getElementById('theme-indicator').innerText = 'Light Mode';
      } else {
        document.body.classList.remove('light-theme');
        document.getElementById('theme-indicator').innerText = 'Dark Mode';
      }
    }
    applyTheme();
    tg.onEvent('themeChanged', applyTheme);

    // --- THREE.JS BACKGROUND SCENE ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const geometry = new THREE.IcosahedronGeometry(1.2, 0);
    const material = new THREE.MeshNormalMaterial({ wireframe: true });
    const shapes = [];

    for (let i = 0; i < 8; i++) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(
        (Math.random() - 0.5) * 10,
        (Math.random() - 0.5) * 10,
        (Math.random() - 0.5) * 5 - 2
      );
      mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      scene.add(mesh);
      shapes.push(mesh);
    }

    camera.position.z = 5;

    function animate() {
      requestAnimationFrame(animate);
      shapes.forEach(shape => {
        shape.rotation.x += 0.003;
        shape.rotation.y += 0.005;
      });
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- FETCH POSTS FROM BACKEND API ---
    // Same origin when served by Flask; works for Mini App HTTPS URL
    const API_URL = "/api/posts";

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function fetchPosts() {
      const feedEl = document.getElementById('feed');
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        if (!data.ok || !data.posts || !data.posts.length) {
          feedEl.innerHTML = `<div class="loading">No posts available yet.</div>`;
          return;
        }

        feedEl.innerHTML = '';
        data.posts.forEach(post => {
          const card = document.createElement('div');
          card.className = 'post-card';

          const img = post.image_url
            ? `<img class="post-image" src="${escapeHtml(post.image_url)}" alt="Post media" loading="lazy" onerror="this.style.display='none'" />`
            : '';

          card.innerHTML = `
            ${img}
            <div class="post-content">
              <p class="post-caption">${escapeHtml(post.caption || 'No caption provided.')}</p>
              <div class="post-footer">
                <span>${post.created_at ? new Date(post.created_at).toLocaleDateString() : ''}</span>
                <a href="${escapeHtml(post.link || '#')}" class="btn-action" target="_blank" rel="noopener">Open Post</a>
              </div>
            </div>
          `;

          card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            card.style.transform = `rotateY(${x / 20}deg) rotateX(${-y / 20}deg)`;
          });

          card.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateY(0deg) rotateX(0deg)';
          });

          // Touch-friendly: light tilt on touch move
          card.addEventListener('touchmove', (e) => {
            if (!e.touches.length) return;
            const t = e.touches[0];
            const rect = card.getBoundingClientRect();
            const x = t.clientX - rect.left - rect.width / 2;
            const y = t.clientY - rect.top - rect.height / 2;
            card.style.transform = `rotateY(${x / 30}deg) rotateX(${-y / 30}deg)`;
          }, { passive: true });

          card.addEventListener('touchend', () => {
            card.style.transform = 'rotateY(0deg) rotateX(0deg)';
          });

          feedEl.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        feedEl.innerHTML = `<div class="loading">Failed to load posts.</div>`;
      }
    }

    fetchPosts();
  </script>
</body>
</html>
